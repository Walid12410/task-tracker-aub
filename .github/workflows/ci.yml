name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["main", "final-project"]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: pytest tests/ -v --tb=short

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t task-tracker-api:ci .

      - name: Smoke-test container
        run: |
          docker run -d --name api -p 8000:8000 task-tracker-api:ci
          sleep 5
          curl --fail http://localhost:8000/health
          docker stop api
